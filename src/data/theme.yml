body:
  light: "#fff"
  dark: "#0b0f14"
darkMode: media
colors:
  default:
    theme_color:
      primary: "#121212"
      body: "#fff"
      border: "#e5e7eb"
      light: "#f6f7f9"
      dark: "#040404"
    text_color:
      text: "#3f4650"
      text-dark: "#0b0f14"
      text-light: "#5b6470"
  darkmode:
    theme_color:
      primary: "#fff"
      body: "#0b0f14"
      border: "#222a35"
      light: "#111720"
      dark: "#fff"
    text_color:
      text: "#b8c0cc"
      text-dark: "#f5f7fa"
      text-light: "#98a2b0"
fonts:
  font_family:
    primary: Roboto+Slab:wght@300;400;600
    primary_type: sans-serif
    secondary: Roboto+Slab:wght@300;400;600
    secondary_type: sans-serif
  font_size:
    base: '16'
    scale: '1.2'
