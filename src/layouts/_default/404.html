{{ define "main" }}
  <section class="hero section text-center">
    <div class="container">
      <div class="mx-auto max-w-xl">
        <p class="font-secondary text-[7rem] font-bold leading-none md:text-[9rem]" style="color: var(--accent)" aria-hidden="true">404</p>
        <h1 class="hero-title-sm mt-4">{{ T "page_not_found" }}</h1>
        <p class="hero-lead mt-5">
          {{ T "page_not_found_description" }}
        </p>
        <div class="mt-9 flex flex-wrap justify-center gap-3">
          <a href="{{ site.BaseURL | relLangURL }}" class="btn btn-primary">{{ T "back_to_home" }}</a>
        </div>
      </div>
    </div>
  </section>
{{ end }}
