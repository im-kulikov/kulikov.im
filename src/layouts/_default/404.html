{{ define "main" }}
  <section class="section-sm text-center">
    <div class="container">
      <div class="row justify-center">
        <div class="sm:col-10 md:col-8 lg:col-6">
          <span
            class="text-[8rem] block font-bold text-text-dark dark:text-darkmode-text-dark">
            404
          </span>
          <h1 class="h2 mb-4">
            {{ T "page_not_found" | default "Страница не найдена" }}
          </h1>
          <div class="content">
            <p>
              {{ T "page_not_found_description" | default "Возможно, страница которую вы ищете, была удалена, у нее изменилось название или она временно недоступна." }}
            </p>
          </div>
          <a
            href="{{ site.BaseURL | relLangURL }}"
            class="btn btn-primary mt-8">
            {{ T "back_to_home" | default "На главную" }}
          </a>
        </div>
      </div>
    </div>
  </section>
{{ end }}
