sub_title:
  ru: "Привет, меня зовут Евгений Куликов!"
  en: "Hi, my name is Evgeniy Kulikov!"
description:
  ru: |
    Мой путь в IT начался ещё в школьные годы с увлечения системами управления, автоматизацией и созданием первых утилит.
    Уже тогда я осознал, что настоящее удовольствие получаю, когда превращаю сложные вещи в понятные, надёжные и эффективные решения. 
    За это время я прошёл путь от фрилансера до TeamLead'а в крупных технологических компаниях, выстроил десятки внутренних и внешних сервисов, 
    руководил командами, оптимизировал процессы и вносил системные изменения, которые улучшали работу не только конкретных продуктов, 
    но и компаний в целом.

    Моя основная специализация — разработка отказоустойчивых сервисов на Go. 
    Я проектирую и реализую высоконагруженные и отказоустойчивые сервисы, строю CI/CD, автоматизирую процессы и интеграции, 
    внедряю Observability и DevOps-практики. Мне близки подходы Domain-Driven Design, Clean Architecture и инженерная дисциплина. 
    Особенно важно для меня — создавать не просто рабочие решения, а понятные, прозрачные и масштабируемые.

    Я ценю качество, открытость и инженерную зрелость. Участвую в Open Source, развиваю собственные библиотеки 
    и помогаю другим становиться лучше — через документацию, обучение и код-ревью. Мне интересны архитектурные задачи, 
    оптимизация процессов и построение сильных технических команд.

    Если вам нужно продумать архитектуру, провести аудит, усилить команду или запустить проект с нуля — буду рад обсудить, 
    чем могу быть полезен.
  en: |
    My path in IT began back in school, with an interest in control systems, automation and writing my first utilities.
    Even then I realised that I get real satisfaction from turning complicated things into clear, reliable and efficient solutions.
    Since then I have gone from freelancer to team lead in large technology companies, built dozens of internal and external services,
    led teams, optimised processes and made systemic changes that improved the work not only of individual products
    but of whole companies.
    
    My main specialisation is building fault-tolerant services in Go.
    I design and build high-load, resilient services, set up CI/CD, automate processes and integrations,
    and introduce observability and DevOps practices. I am drawn to Domain-Driven Design, Clean Architecture and engineering discipline.
    What matters most to me is building solutions that are not merely working, but clear, transparent and scalable.
    
    I value quality, openness and engineering maturity. I take part in open source, maintain my own libraries
    and help others grow, through documentation, teaching and code review. I am interested in architectural problems,
    process optimisation and building strong technical teams.
    
    If you need to work out an architecture, run an audit, strengthen a team or launch a project from scratch,
    I would be glad to discuss how I can help.
