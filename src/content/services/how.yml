title: Как мы будем работать
class: section-md mb-20
icon: briefcase
description: |
  Формат подбираем под задачу: аудит, проектирование, запуск MVP, усиление команды или ведение направления —
  на контракте, по найму или как совместный проект. Контакты бывших руководителей и коллег для рекомендаций дам по запросу.
items:
  - Короткий созвон. Вы описываете задачу и ограничения, я задаю вопросы и честно говорю, моя ли это задача.
  - Фиксируем цель, объём и формат. Вы заранее знаете, что получите на выходе и как мы будем отслеживать прогресс.
  - Работаю прозрачно. Регулярные короткие отчёты, решения и договорённости фиксируются письменно.
  - Передаю результат так, чтобы команда могла жить без меня. Документация, обучение, понятные процессы.
