name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # monthly rebuild: the footer year is rendered at build time
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Europe/Moscow

jobs:
  # Runs for every trigger, including pull requests. Read-only: it can never deploy.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Test
        run: npm test
      - name: Browser tests
        run: npm run test:e2e
      # JS coverage of src/assets/js (browser tests against an unminified, source-mapped build); templates and CSS have no line coverage
      - name: JS coverage
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false # a Codecov outage or a fork PR without the secret must not block the merge

  # Runs next to `check` (own runner, so the timings are not disturbed by the tests). Not a deploy gate: a slow runner must not block a release.
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # only to post the results comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Build
        run: node tests/build.mjs
      - name: Lighthouse
        run: npm run lighthouse
      # one comment per pull request, updated in place by each push; not for forks (their token is read-only)
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- lighthouse-summary -->")) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@build/lighthouse/summary.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@build/lighthouse/summary.md
          fi
      # full reports (what is slow and why), kept for a short time
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: build/lighthouse
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history: .GitInfo gives each page its own lastmod in the sitemap
      - uses: ./.github/actions/setup
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BUILD_SHA: ${{ github.sha }}
        run: |
          export HUGO_BUILD_DATE="$(git show -s --format=%cI HEAD)"
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
